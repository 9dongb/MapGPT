[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mapgpt"
version = "0.1.0"
description = "자연어 공간 분석 질문을 Typed Analysis Plan으로 바꿔 PostGIS에서 실행하는 AI Agent (MVP)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "psycopg[binary,pool]>=3.2",
    "openai>=3.0",
    "langgraph>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.16",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["db/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not e2e'"
markers = [
    "integration: PostGIS(mapgpt_test DB)가 필요한 테스트",
    "e2e: 실제 데이터와 실제 LLM이 필요한 테스트 (pytest -m e2e)",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "B"]
# 프롬프트·오류 메시지의 긴 한국어 문자열은 나누지 않는다. 코드의 줄 길이는 ruff format이 맞춘다.
ignore = ["E501"]
