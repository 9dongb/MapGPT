services:
  db:
    build: ./docker/postgres
    image: mapgpt/postgis-pgvector:17-3.5
    environment:
      POSTGRES_USER: mapgpt
      POSTGRES_PASSWORD: mapgpt
      POSTGRES_DB: mapgpt
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mapgpt -d mapgpt"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
