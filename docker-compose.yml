services:
  db:
    # postgis/postgis 공식 이미지는 amd64 전용이라, 같은 메인테이너의 multi-arch 빌드를 사용한다.
    image: imresamu/postgis:17-3.5
    environment:
      POSTGRES_USER: mapgpt
      POSTGRES_PASSWORD: mapgpt
      POSTGRES_DB: mapgpt
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mapgpt -d mapgpt"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
